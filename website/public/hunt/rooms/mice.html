<script>
const scenario=document.body.dataset.scenario, tricky=scenario==='cat-decoys';
const positions=[
 {x:129,y:110,s:.75,color:'#d3ac7e',place:'between the books'},
 {x:658,y:190,s:.82,color:'#8a8d81',place:'on the windowsill'},
 {x:139,y:192,s:.66,color:'#c39065',place:'beside the clock'},
 {x:390,y:306,s:.91,color:'#c1ac90',place:'on the sofa'},
 {x:679,y:399,s:.82,color:'#997e67',place:'in the basket'},
 {x:197,y:444,s:.73,color:'#957c69',place:'under the armchair'},
 {x:112,y:481,s:1.02,color:'#ddba8c',place:'at the edge of the rug'},
 {x:487,y:479,s:.75,color:'#b38368',place:'under the coffee table'},
 {x:737,y:276,s:.78,color:'#8d9a81',place:'beside the tall plant'}
];
if(scenario==='dogs')positions.forEach((p,i)=>{p.s*=.85;p.x=[84,294,712,434,600,228,112,507,745][i];p.y=[190,125,171,330,443,421,499,495,331][i];p.place=['beside the tree','on the hill','by the fence','in the grass','near the flowers','behind the ball','on the path','near the bench','at the fence'][i]});
if(scenario==='mice')positions.forEach((p,i)=>{p.s*=.48;p.x=[128,647,227,387,715,98,294,552,456][i];p.y=[149,279,279,149,414,414,502,502,414][i];p.place='among the pantry jars'});
if(scenario==='striped')positions.forEach((p,i)=>{p.s=.6;p.x=[107,568,290,692,453,186,609,358,759][i];p.y=[130,172,258,334,386,465,468,118,227][i];p.place='in the crowd'});
const room=document.getElementById('room');
if(scenario==='dogs')room.innerHTML='<rect width="850" height="600" fill="#dce9de"/><path d="M0 230Q210 80 420 238T850 210V600H0Z" fill="#9dbb8a"/><path d="M-20 500Q220 300 500 530T880 460" fill="none" stroke="#dfc898" stroke-width="65"/><g fill="#73926d"><circle cx="90" cy="105" r="70"/><circle cx="35" cy="150" r="63"/><circle cx="136" cy="160" r="72"/></g><path d="M92 145v240" stroke="#a58161" stroke-width="20"/><path d="M40 310H815M40 344H815" stroke="#e9dfbf" stroke-width="12"/><path d="M55 286v90m90-90v90m90-90v90m90-90v90m90-90v90m90-90v90m90-90v90m90-90v90m90-90v90" stroke="#efe6cf" stroke-width="14"/><path d="M490 420h160m-150 25h145m-130-26v85m110-85v85" stroke="#a08565" stroke-width="12"/><circle cx="247" cy="470" r="25" fill="#cf9379"/><path d="m230 453 34 34m-34 0 34-34" stroke="#f5d3aa" stroke-width="4"/><g fill="#e7cf96">'+Array.from({length:32},(_,i)=>`<circle cx="${(i*127)%820+15}" cy="${380+(i*53)%203}" r="4"/>`).join('')+'</g><g id="animals"></g><g id="marks"></g>';
if(scenario==='mice')room.innerHTML='<rect width="850" height="600" fill="#e7dbc3"/>'+[80,210,345,475].map((y,row)=>`<rect x="38" y="${y+85}" width="775" height="14" rx="3" fill="#a58562"/>`+Array.from({length:11},(_,i)=>`<g transform="translate(${58+i*69} ${y})"><rect y="12" width="47" height="72" rx="8" fill="${['#abb69a','#cba47e','#d8c69e','#aeaea0'][(i+row)%4]}" stroke="#947d60"/><rect x="-2" y="5" width="51" height="12" rx="3" fill="#91775c"/><rect x="8" y="36" width="31" height="25" rx="3" fill="#efdfbd"/><path d="M12 43h21m-21 7h16m-16 6h21" stroke="#bdac8e" stroke-width="2"/></g>`).join('')).join('')+'<g id="animals"></g><g id="marks"></g>';
function person(x,y,s,shirt,hat,glasses,stripes){return `<g transform="translate(${x} ${y}) scale(${s})" stroke="#665a50" stroke-width="1.1"><path d="M22 48v16m17-16v16" stroke="#53728c" stroke-width="9"/><path d="M17 26h28l5 26H12Z" fill="${shirt}"/>${stripes?'<path d="M17 29h28m-30 8h32m-34 8h36" stroke="#f8eee0" stroke-width="5"/>':''}<circle cx="31" cy="17" r="12" fill="#e3b99b"/><path d="M18 13q1-17 23-6l3 7Z" fill="${hat}"/><rect x="18" y="10" width="26" height="5" rx="2" fill="${stripes?'#f8eee0':hat}"/><circle cx="31" cy="2" r="4" fill="${hat}"/>${glasses?'<g fill="none" stroke="#504f4a"><circle cx="26" cy="19" r="4.5"/><circle cx="36" cy="19" r="4.5"/><path d="M30 19h2"/></g>':'<path d="M25 19h2m7 0h2"/>'}<path d="M28 25q3 3 6 0" fill="none"/><path d="M15 30 8 46m37-16 9 16" stroke="#e3b99b" stroke-width="5"/></g>`}
if(scenario==='striped')room.innerHTML='<rect width="850" height="600" fill="#d9dfcf"/><path d="M0 76H850M0 585H850" stroke="#b9c3af" stroke-width="14"/>'+Array.from({length:120},(_,i)=>{const col=i%15,row=Math.floor(i/15);return person(12+col*56+(row%2)*11,45+row*66,.78,['#c95446','#839b9a','#a39b72','#8f9b77','#a89ba2'][i%5],i%5!==0&&i%7===0?'#c95446':['#6f887e','#caac75','#9a876e'][i%3],i%3===0,i%4===0)}).join('')+'<g id="animals"></g><g id="marks"></g>';
room.setAttribute('aria-label',scenario==='dogs'?'A busy park full of small dogs.':scenario==='mice'?'A pantry. Find tiny mice among the jars and cheese.':scenario==='striped'?'A crowd. Find the red and white striped shirt and hat, round glasses and blue trousers.':'An illustrated room with hidden cats.');
const decoyIDs=tricky||scenario==='mice'?[0,3,7]:scenario==='striped'?[0,1,2,3,5,6,7,8]:[], found=new Set(); let revealed=false;
const targets=positions.map((p,id)=>({...p,id,decoy:decoyIDs.includes(id),box:{X:p.x/850*100,Y:p.y/600*100,Width:62*p.s/850*100,Height:65*p.s/600*100}}));
function animal(p){const eyes=p.decoy?'<path d="m18 24 6 6m0-6-6 6m18-6 6 6m0-6-6 6" stroke="#5c5147" stroke-width="2"/>':'<path d="M17 28q4-6 8 0m10 0q4-6 8 0" stroke="#51473d" stroke-width="2" fill="none"/>';
return `<g data-target="${p.id}" role="button" tabindex="0" aria-label="Check hiding spot ${p.id+1}" transform="translate(${p.x} ${p.y}) scale(${p.s})" fill="${p.color}" stroke="#6f5e4e" stroke-width="1.5" stroke-linejoin="round"><path d="M45 52q21 4 12-17" fill="none" stroke="${p.color}" stroke-width="7" stroke-linecap="round"/><ellipse cx="29" cy="47" rx="22" ry="17"/><path d="m10 21 1-19 17 12q6-2 12 0L52 2l-1 23q3 20-21 20T10 21Z"/><path d="m15 18 1-9 9 8m16 0 7-9-1 11" fill="#d69e8b" stroke="none"/>${eyes}<path d="m28 32 3 3 3-3Z" fill="#9b6a61" stroke="none"/><path d="M31 35v4m-3-1 3 1 3-1m-20-5-10-2m10 6-10 1m42-5 12-2m-12 6 12 1" stroke="#6c594b" fill="none" stroke-width="1"/><ellipse cx="19" cy="59" rx="7" ry="4"/><ellipse cx="37" cy="59" rx="7" ry="4"/>${p.decoy?'<path d="M11 44q19 13 39 0M15 50l-3 4m11-1-1 5m11-4 1 5m9-7 3 4" stroke="#eee0ca" stroke-width="1.5" fill="none"/><rect x="46" y="46" width="10" height="7" fill="#f2dfb8" transform="rotate(18 46 46)"/>':'<path d="m25 15 2 6m8-6-2 6m-18 22 5 2m20-2-5 2" fill="none" stroke="#6f5e4e" stroke-width="2"/>'}</g>`}
function figure(p){if(!['dogs','mice','striped'].includes(scenario))return animal(p);const attrs=`data-target="${p.id}" role="button" tabindex="0" aria-label="Check hiding spot ${p.id+1}"`;
if(scenario==='striped'){const drawing=person(p.x,p.y,p.s,p.decoy?'#a38b7f':'#c95446',p.decoy?'#668b84':'#c95446',true,true);return drawing.replace('<g ',`<g ${attrs} `)}
const draw=scenario==='dogs'?`<path d="M44 43q22-14 15-23" fill="none" stroke="${p.color}" stroke-width="8"/><ellipse cx="32" cy="43" rx="23" ry="16" fill="${p.color}"/><path d="M12 40v21m31-21v21" stroke="${p.color}" stroke-width="9"/><circle cx="26" cy="22" r="18" fill="${p.color}"/><ellipse cx="9" cy="25" rx="7" ry="17" fill="#836a55"/><ellipse cx="44" cy="25" rx="7" ry="17" fill="#836a55"/><ellipse cx="27" cy="31" rx="12" ry="8" fill="#eed4ad"/><circle cx="21" cy="20" r="2"/><circle cx="33" cy="20" r="2"/><path d="m23 28 4 5 4-5Z" fill="#564e47"/><path d="M18 42h20" stroke="#b66e57" stroke-width="4"/>`:p.decoy?'<path d="m4 58 48-32 8 32Z" fill="#d7b364" stroke="#a58b53"/><g fill="#aa8c52"><circle cx="31" cy="49" r="5"/><circle cx="48" cy="51" r="3"/><circle cx="44" cy="39" r="3"/></g>':`<path d="M41 51q30-10 19-25" fill="none" stroke="#b3928d" stroke-width="3"/><ellipse cx="29" cy="48" rx="24" ry="13" fill="#929489"/><circle cx="17" cy="29" r="13" fill="#929489"/><circle cx="8" cy="18" r="10" fill="#929489"/><circle cx="27" cy="17" r="10" fill="#929489"/><circle cx="8" cy="18" r="6" fill="#c9a6a1"/><circle cx="27" cy="17" r="6" fill="#c9a6a1"/><circle cx="14" cy="28" r="2" fill="#373e39"/><path d="m5 32-5 4 7 2m2-2L0 27m10 10L0 43" fill="none" stroke="#676c63"/>`;
return `<g ${attrs} transform="translate(${p.x} ${p.y}) scale(${p.s})" stroke="#6c6253" stroke-width="1" stroke-linejoin="round">${draw}</g>`}
document.getElementById('animals').innerHTML=targets.map(figure).join('');
// A continuous touch area also covers gaps between the illustrated body parts.
document.querySelectorAll('[data-target]').forEach(target=>target.insertAdjacentHTML('afterbegin','<rect width="62" height="65" fill="transparent" stroke="none" pointer-events="all"/>'));
function marks(){document.getElementById('marks').innerHTML=targets.filter(p=>!p.decoy&&(revealed||found.has(p.id))).map((p,i)=>`<rect class="found" x="${p.x-5}" y="${p.y-5}" width="${62*p.s+10}" height="${65*p.s+10}" rx="12"/><circle cx="${p.x+62*p.s}" cy="${p.y}" r="11" fill="#356b51"/><text class="number" x="${p.x+62*p.s}" y="${p.y+5}">${revealed?targets.filter(q=>!q.decoy).findIndex(q=>q.id===p.id)+1:'✓'}</text>`).join('')}
function tell(data){if(parent!==window)parent.postMessage({type:'cat-spot',scenario,...data},location.origin)}
function spot(p){if(revealed){tell({kind:'revealed'});return}if(!p){tell({kind:'miss'});return}if(p.decoy){tell({kind:'decoy'});return}if(document.body.dataset.broken==='true'&&p.id===(targets.filter(q=>!q.decoy)[1]||targets.find(q=>!q.decoy)).id){tell({kind:'broken'});return}const repeat=found.has(p.id);found.add(p.id);marks();tell({kind:repeat?'repeat':'cat',found:found.size,complete:found.size===targets.filter(p=>!p.decoy).length,place:p.place})}
document.getElementById('animals').addEventListener('keydown',event=>{if(!['Enter',' '].includes(event.key))return;const id=event.target.getAttribute('data-target');if(id===null)return;event.preventDefault();spot(targets.find(p=>p.id===Number(id)))})
document.getElementById('room').addEventListener('click',event=>{const bounds=event.currentTarget.getBoundingClientRect(),x=(event.clientX-bounds.left)*850/bounds.width,y=(event.clientY-bounds.top)*600/bounds.height;const p=targets.find(p=>x>=p.x-3&&x<=p.x+62*p.s+3&&y>=p.y-3&&y<=p.y+65*p.s+3);spot(p)});
// Synthetic answer map: used by the game and Playwright, never by the model.
window.catGame=Object.freeze({targets:()=>targets.map(p=>({id:p.id,decoy:p.decoy,box:{...p.box},place:p.place})),reveal:()=>{revealed=true;marks();return targets.filter(p=>!p.decoy).length}});
</script></body></html>
