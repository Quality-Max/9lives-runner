name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify release identity and main ancestry
        id: identity
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/verify-cli-release.cjs

  qualification:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [check-tag, qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, goos: darwin, goarch: amd64}
          - {runner: macos-15, goos: darwin, goarch: arm64}
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {runner: windows-2022, goos: windows, goarch: amd64}
          - {runner: windows-11-arm, goos: windows, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.check-tag.outputs.version }}
      BUNDLE: 9l-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: 1.25.13
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, exercise and package native release executable
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: python scripts/package-cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  publish:
    needs: [check-tag, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-9l-*
          path: dist
          merge-multiple: true
      - name: Verify archive contents and write SHA-256 checksums
        run: python3 scripts/check-cli-archives.py dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/9l-*.tar.gz
            dist/9l-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
