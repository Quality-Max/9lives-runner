name: Release

# One v<version> tag releases the CLI and @9l/playwright together: the tag is
# verified against every declared version, CI qualifies the commit once, the
# CLI archives are published as a GitHub Release, and then the SDK tarball
# that same qualification packed is published to npm. The npm trusted
# publisher must name this workflow file (docs/releases.md).
on:
  push:
    tags: ['v*']

# A tag is released once at a time; a rerun waits for an earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify the tag against the CLI and SDK versions and main ancestry
        id: identity
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/verify-release.cjs

  qualification:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [check-tag, qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, goos: darwin, goarch: amd64}
          - {runner: macos-15, goos: darwin, goarch: arm64}
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {runner: windows-2022, goos: windows, goarch: amd64}
          - {runner: windows-11-arm, goos: windows, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.check-tag.outputs.version }}
      BUNDLE: 9l-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.3
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build, exercise and package native release executable
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: python scripts/package-cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  # Only this job attests the CLI release: id-token mints the Sigstore
  # signing certificate and attestations stores the provenance for the
  # archives and SHA256SUMS.
  github-release:
    needs: [check-tag, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-9l-*
          path: dist
          merge-multiple: true
      - name: Verify archive contents and write SHA-256 checksums
        run: python3 scripts/check-cli-archives.py dist
      # Attest before publishing, from the same files the next step uploads,
      # so every published asset carries provenance for its exact bytes.
      - name: Attest build provenance for the archives and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/9l-*.tar.gz
            dist/9l-*.zip
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/9l-*.tar.gz
            dist/9l-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
      # Download what the release now serves and check it the way users do:
      # the same names and bytes as this run attested, and a provenance
      # attestation from this workflow at this tag. A failure stops the run
      # before the npm job.
      - name: Verify the published assets and their attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern '9l-*' --pattern SHA256SUMS
          diff <(ls dist) <(ls published)
          for file in dist/*; do
            name=$(basename "$file")
            cmp "$file" "published/$name"
            gh attestation verify "published/$name" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  # Runs after the GitHub Release so the SDK never reaches npm without its
  # CLI. A rerun skips when npm already holds these exact bytes.
  npm:
    needs: [check-tag, qualification, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Require an OIDC-capable npm client
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) process.exit(1)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playwright-package-${{ github.sha }}
          path: .context/npm-pack/
      - name: Publish the qualified SDK tarball using npm trusted publishing
        run: node scripts/publish-sdk.cjs
