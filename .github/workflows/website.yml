name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'install/**'
      - 'docs/explainer/**'
      - 'scripts/site-smoke.cjs'
      - 'scripts/export-overview.cjs'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'install/**'
      - 'docs/explainer/**'
      - 'scripts/site-smoke.cjs'
      - 'scripts/export-overview.cjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:vercel
      - name: Install browser qualification tools
        working-directory: .
        run: |
          npm ci
          npm exec playwright install --with-deps chromium
      - name: Qualify the production homepage and portable overview
        working-directory: .
        run: |
          mkdir -p .context
          (cd website && npm exec next start -- --port 3000) > .context/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:3000/; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Production homepage did not start within 30 seconds" >&2
            exit 1
          fi
          node scripts/site-smoke.cjs

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      # The installer runs offline against fixture releases; the site test
      # keeps the served copy identical to install/9l.run.sh.
      - run: python -m pytest -q install website/test_site.py
