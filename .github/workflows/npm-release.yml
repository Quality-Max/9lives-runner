name: Publish Playwright SDK

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify release identity and main ancestry
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/verify-sdk-release.cjs

  qualification:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check-tag, qualification]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require an OIDC-capable npm client
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) process.exit(1)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-package-${{ github.sha }}
          path: .context/npm-pack/
      - name: Publish qualified tarball using npm trusted publishing
        run: node scripts/publish-sdk.cjs
