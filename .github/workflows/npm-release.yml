name: Publish Playwright SDK

on:
  push:
    tags: ['sdk-v*']
    branches: [main]
    paths: ['packages/playwright/package.json']

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify release identity and main ancestry
        id: identity
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/verify-sdk-release.cjs

  qualification:
    needs: check-tag
    if: needs.check-tag.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check-tag, qualification]
    if: needs.check-tag.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require an OIDC-capable npm client
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) process.exit(1)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-package-${{ github.sha }}
          path: .context/npm-pack/
      - name: Publish qualified tarball using npm trusted publishing
        run: node scripts/publish-sdk.cjs

  # Record the published commit. The "Protect release tags" ruleset refuses
  # tag creation by the workflow token, so the tag is pushed with the
  # repository's write deploy key, which the ruleset lets bypass; secrets are
  # not available to workflows from forks. A deploy-key push triggers this
  # workflow again on the tag, which check-tag then skips as already published.
  tag:
    needs: [check-tag, publish]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Push the sdk-v tag on the published commit with the release deploy key
        env:
          SDK_RELEASE_TAG_KEY: ${{ secrets.SDK_RELEASE_TAG_KEY }}
        run: |
          if [ -z "$SDK_RELEASE_TAG_KEY" ]; then
            echo "::error::secret SDK_RELEASE_TAG_KEY is not set; push the tag by hand: git push origin $GITHUB_SHA:refs/tags/sdk-v$VERSION"
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SDK_RELEASE_TAG_KEY" > ~/.ssh/sdk_release_tag
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND='ssh -i ~/.ssh/sdk_release_tag -o IdentitiesOnly=yes' git push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/tags/sdk-v$VERSION"
          rm -f ~/.ssh/sdk_release_tag
