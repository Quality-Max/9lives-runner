name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      # Offline contract tests skip locally without Python or the pinned
      # upstream sources; CI must fail instead of skipping.
      NINELIVES_REQUIRE_CONTRACT: "1"
      NINELIVES_REQUIRE_ASSESSMENT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout NineLives 0.1.3 compatibility source
        uses: actions/checkout@v4
        with:
          repository: Quality-Max/9lives
          ref: 8a40d8d5c83f27f84384f060aeed74a3ded7ab77
          path: testdata/upstream/ninelives-0.1.3
      - name: Checkout NineLives 0.2.1 compatibility source
        uses: actions/checkout@v4
        with:
          repository: Quality-Max/9lives
          ref: 568c7a6882441c13cdb9bfe8c0190ca0bf7d8240
          path: testdata/upstream/ninelives-0.2.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install offline contract validator
        run: python -m pip install 'pydantic==2.11.7' 'jsonschema==4.26.0'
      - run: go test -race ./...
      - name: Native Tier 1 pinned Python differential
        run: go test ./internal/healing ./internal/contracttest -run 'TestPinnedPython(Differential|ClassifierAndStrategyCorpus|OracleIdentityAndCaches)' -count=1
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Exercise Playwright fixture
        run: |
          npm ci --prefix testdata/playwright
          go run ./cmd/9l plan testdata/playwright/tests/pass.spec.ts --format json
          go run ./cmd/9l run testdata/playwright/tests/pass.spec.ts --format json --receipt-dir "$RUNNER_TEMP/9lives-receipts"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - name: Release-style build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o dist/9l-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/9l
      - uses: actions/upload-artifact@v4
        with:
          name: 9l-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/9l-${{ matrix.goos }}-${{ matrix.goarch }}

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify committed parser against locked source and license
        run: node scripts/bundle-assessment-parser.cjs --check
      - run: npm test
      - name: Standalone assessment portability
        run: node scripts/assessment-portability-smoke.cjs
      - name: Assessment CLI provenance diagnostic
        run: go test ./cmd/9l -run '^TestAssessWarnsWhenRequestedProvenanceCannotBeCaptured$' -count=1
      - run: npm exec playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run smoke:assessment
      - name: Qualify packed SDK in an isolated consumer
        run: npm run smoke:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-package-${{ github.sha }}
          path: .context/npm-pack/
          if-no-files-found: error
          include-hidden-files: true

  # The SDK peer range admits later Playwright 1.x releases. Qualify every
  # published release up to 1.64 with the sdk job's checks; that job covers
  # the 1.61.1 workspace pin and alone produces the publishable tarball.
  playwright-compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.62.0', '1.62.1', '1.63.0', '1.64.0']
    env:
      PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select the Playwright release in every workspace and fixture
        run: |
          node scripts/select-playwright.cjs "$PLAYWRIGHT_VERSION"
          npm install --no-audit --no-fund
          npm install --prefix testdata/playwright --no-audit --no-fund
          node scripts/select-playwright.cjs --check "$PLAYWRIGHT_VERSION"
      - run: npm test
      - run: npm exec playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run smoke:assessment
      - name: Qualify packed SDK in an isolated consumer
        run: npm run smoke:package
      - name: Exercise Playwright fixture
        run: |
          go run ./cmd/9l plan testdata/playwright/tests/pass.spec.ts --format json
          go run ./cmd/9l run testdata/playwright/tests/pass.spec.ts --format json --receipt-dir "$RUNNER_TEMP/9lives-receipts"
