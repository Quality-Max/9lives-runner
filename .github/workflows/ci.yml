name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      # Offline contract tests skip locally without Python or the pinned
      # upstream sources; CI must fail instead of skipping.
      NINELIVES_REQUIRE_CONTRACT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout NineLives 0.1.3 compatibility source
        uses: actions/checkout@v4
        with:
          repository: Quality-Max/9lives
          ref: 8a40d8d5c83f27f84384f060aeed74a3ded7ab77
          path: testdata/upstream/ninelives-0.1.3
      - name: Checkout NineLives 0.2.1 compatibility source
        uses: actions/checkout@v4
        with:
          repository: Quality-Max/9lives
          ref: 568c7a6882441c13cdb9bfe8c0190ca0bf7d8240
          path: testdata/upstream/ninelives-0.2.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline contract validator
        run: python -m pip install 'pydantic==2.11.7' 'jsonschema==4.26.0'
      - run: go test -race ./...
      - name: Native Tier 1 pinned Python differential
        run: go test ./internal/healing ./internal/contracttest -run 'TestPinnedPython(Differential|ClassifierAndStrategyCorpus|OracleIdentityAndCaches)' -count=1
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Exercise Playwright fixture
        run: |
          npm ci --prefix testdata/playwright
          go run ./cmd/9l plan testdata/playwright/tests/pass.spec.ts --format json
          go run ./cmd/9l run testdata/playwright/tests/pass.spec.ts --format json --receipt-dir "$RUNNER_TEMP/9lives-receipts"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: true
      - name: Release-style build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o dist/9l-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/9l
      - uses: actions/upload-artifact@v4
        with:
          name: 9l-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/9l-${{ matrix.goos }}-${{ matrix.goarch }}
