name: Tag probe (temporary)
on:
  push:
    branches: [Desperado/sdk-release-tag]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Unprotected tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/probe-unprotected" -f sha="$GITHUB_SHA" && echo "UNPROTECTED_CREATED=yes"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/probe-unprotected" && echo "UNPROTECTED_DELETED=yes"
      - name: Protected release tag on the published commit
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/sdk-v0.1.1" -f sha="49d39a340aa9a367f0d176481eae1f010d3a84af" && echo "PROTECTED_CREATED=yes"
