ne lives", "artifact": "Linux · macOS · Windows | x64 + ARM64", "button": "Keep your suite. Inspect the evidence.", "status": "Built for modern Playwright workflows.", "terminal": "Feature tour · next steps", "code": "Agent-assisted generation + provenance\nAdvisory assessment + local execution\nExperimental healing + fault checks\nExperimental finding confirmation\nNative MCP + optional Playwright SDK\n\nSee the docs for each feature’s boundaries.", "step": 5, "tag": "9LIVES · CREATE. ASSESS. RUN. HEAL."}];
