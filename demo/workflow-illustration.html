<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9lives: QualityMax Demo Bank walkthrough</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f2f6fc;font-family:Arial,sans-serif;width:1280px;height:880px;padding:32px 48px}
header{display:flex;align-items:center;justify-content:space-between;height:40px;font-size:26px;color:#b6c5d9}
.brand{font-weight:800;font-size:34px;color:#6ceac3}.brand span{color:#f2f6fc;font-weight:400;font-size:26px;margin-left:16px}
#counter{font:26px Menlo,monospace;color:#6ceac3}
h1{font-size:54px;letter-spacing:-1.6px;line-height:1.12;margin:26px 0 14px}
#intro{font-size:28px;line-height:1.4;color:#c7d3e4;margin:0;height:42px}
#stage{height:466px;margin-top:26px;border:1px solid #35465e;border-radius:18px;background:#131f31;overflow:hidden}
.panelbar{height:58px;background:#1c2b40;color:#cbd7e7;display:flex;align-items:center;padding:0 26px;font-size:24px;justify-content:space-between}
.panelbar span:last-child{color:#79edcb}
pre{font-family:Menlo,Consolas,monospace;font-size:32px;line-height:1.6;margin:0;padding:24px 30px;white-space:pre-wrap;overflow-wrap:anywhere;color:#edf4ff}
.dim{color:#b3c5df}.green{color:#79edcb}.red{color:#ffa4af}.yellow{color:#ffda8a}.blue{color:#8acbff}
.split{display:grid;grid-template-columns:540px 1fr;height:406px}
.capture{background:#fff;display:flex;align-items:center;justify-content:center;padding:20px 30px}
.capture img{display:block;max-width:100%;max-height:360px;width:100%;object-fit:contain}
.explanation{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:24px;font-size:32px;line-height:1.4}
.explanation p{margin:0}.label{font-size:25px;color:#b3c5df}.large{font-size:48px;font-weight:700;line-height:1.2}
.result{padding:28px 32px;display:grid;grid-template-columns:1fr 1fr;gap:26px;font-size:30px;line-height:1.45}
.result p{margin:8px 0}.result .large{font-size:46px;margin-bottom:22px}
#note{font-size:25px;color:#c4d2e5;margin:20px 0 0;height:38px;line-height:1.4}
nav{display:flex;gap:10px;margin-top:14px;font-size:24px}
nav span{flex:1;text-align:center;border-top:4px solid #35465e;padding-top:12px;color:#a8bad0}
nav .active{color:#79edcb;border-color:#79edcb}nav .done{color:#e0e9f5;border-color:#4a9d89}
</style>
<header><div class="brand">9lives<span>QualityMax Demo Bank</span></div><div id="counter"></div></header>
<h1 id="title"></h1><p id="intro"></p>
<main id="stage"></main><p id="note"></p><nav aria-label="Demo stages" id="steps"></nav>
<script>
const terminal = (label, body, badge = 'Real run · edited for readability') =>
 `<div class="panelbar"><span>${label}</span><span>${badge}</span></div><pre>${body}</pre>`;
const browser = (image, body) => `<div class="panelbar"><span>qualitymax-demo-bank.vercel.app</span><span>Actual browser capture</span></div><div class="split"><div class="capture"><img src="${image}" alt="Demo Bank sign-in form with empty fields"></div><div class="explanation">${body}</div></div>`;
const frames = [
 {step:0, duration:6500, title:'A broken locator. A checked repair.',
 intro:'Watch 9lives assess, run and heal a real Playwright test.',
 body:browser('demo-bank-login.png', '<p class="label">THE TEST CASE</p><p class="large">Empty sign-in<br>stays signed out.</p><p>We deliberately give the test the wrong button name.</p>'),
 note:'Real public demo app · seeded failure · experimental healing'},
 {step:0, duration:8500, title:'1. Start with a clear requirement.',
 intro:'The coding agent drafts an ordinary Playwright spec.',
 body:terminal('Agent-authored draft · excerpt', '<span class="dim">Requirement:</span> reject an empty sign-in\n\nawait page.getByRole("button", {\n  name: <span class="red">"Log In"</span>, exact: true\n}).click();\n<span class="dim">// Followed by explicit form assertions.</span>', 'Prepared draft · no model call in replay'),
 note:'Test creation is agent-assisted; there is no native “9l generate” command.'},
 {step:0, duration:7000, title:'2. Keep a record of the draft.',
 intro:'Capture the source before assessing or changing it.',
 body:terminal('Creation provenance', '<span class="green">$</span> 9l provenance tests/bank.spec.ts\n    --agent codex\n\nSource snapshot recorded.\nDraft hash matches the assessed source.\n<span class="dim">Declared author: codex</span>'),
 note:'The source hash tracks changes; the agent name is a declaration.'},
 {step:1, duration:8000, title:'3. Find the fixed wait.',
 intro:'Static assessment flags a problem before execution.',
 body:terminal('Advisory assessment', '<span class="green">$</span> 9l assess tests/bank.spec.ts\n    --requirements requirements.json\n\n<span class="yellow">Finding: fixed-wait</span>\nawait page.waitForTimeout(400);\n<span class="dim">Review: remove the unnecessary delay.</span>'),
 note:'The replay script removes the seeded wait. Assessment does not edit tests.'},
 {step:2, duration:7500, title:'4. Run it. See the real failure.',
 intro:'The spec looks for “Log In”. The actual button says “Sign In”.',
 body:terminal('Original execution', '<span class="green">$</span> 9l run tests/bank.spec.ts\n\n<span class="red">FAIL  ·  1 test</span>\ngetByRole("button", { name: "Log In" })\n<span class="dim">The click timed out waiting for that button.</span>'),
 note:'The stale name was planted for this demo; the bank itself was not changed.'},
 {step:3, duration:8000, title:'5. Repair one locator, offline.',
 intro:'9lives re-runs the original, then verifies a candidate in isolation.',
 body:terminal('Native healing · experimental', '<span class="green">$</span> 9l heal tests/bank.spec.ts --provider none\n\n<span class="red">− name: "Log In"</span>\n<span class="green">+ name: "Sign In"</span>\n\nProvider calls: <span class="green">0</span>'),
 note:'Only that locator literal changed. All assertions stayed byte-for-byte intact.'},
 {step:4, duration:8000, title:'6. Check the behavior after the click.',
 intro:'The repaired test submits the empty form in real Chromium.',
 body:browser('demo-bank-validation.png', '<p class="green">✓ Username is invalid.</p><p class="green">✓ Username has focus.</p><p class="green">✓ Username stays empty.</p><p class="green">✓ Sign-in prompt remains.</p>'),
 note:'No credentials entered, authentication performed or banking transaction made.'},
 {step:4, duration:7500, title:'7. Inspect the verified candidate.',
 intro:'A passing repair is saved separately for review.',
 body:terminal('Checked healing result', '<span class="green">PASS  ·  1 test executed</span>\n\nState: verified\nCandidate: tests/bank.spec.ts.healed\nAssertions: unchanged\nOriginal file: <span class="yellow">not applied</span>'),
 note:'A passing rerun checks these assertions; it cannot prove they cover every bug.'},
 {step:5, duration:7500, title:'Try the same workflow.',
 intro:'From a clone of Quality-Max/9lives-runner:',
 body:terminal('Run the public Demo Bank example', 'npm ci\nnpm exec playwright install chromium\n<span class="green">npm run demo:bank</span>\n\n<span class="dim">Needs Go 1.25.13+ and Node 24.</span>\n<span class="dim">No model key or QualityMax account.</span>', 'Copyable instructions in demo/README.md'),
 note:'Recorded on macOS · CLI binaries available for Linux, macOS and Windows.'},
];
window.frameCount = frames.length;
window.frameDurations = frames.map(frame => frame.duration);
window.showFrame = async index => {
 const frame=frames[index];
 document.getElementById('counter').textContent=`${String(index+1).padStart(2,'0')} / ${frames.length}`;
 document.getElementById('title').textContent=frame.title;
 document.getElementById('intro').textContent=frame.intro;
 document.getElementById('stage').innerHTML=frame.body;
 document.getElementById('note').textContent=frame.note;
 document.getElementById('steps').innerHTML=['Draft','Assess','Run','Heal','Verify','Try it'].map((label,i)=>`<span class="${i===frame.step?'active':i<frame.step?'done':''}">${label}</span>`).join('');
 await Promise.all([...document.images].map(img=>img.decode()));
};
showFrame(0);
// Arrow keys let reviewers inspect each frame without waiting for the GIF.
let current=0;
addEventListener('keydown', event => {
 if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
 current=(current+(event.key==='ArrowRight'?1:-1)+frames.length)%frames.length;
 showFrame(current);
});
</script>
</html>
