</svg>
<script>
const scenario=document.body.dataset.scenario, tricky=scenario==='cat-decoys';
const positions=[
 {x:129,y:110,s:.75,color:'#d3ac7e',place:'between the books'},
 {x:658,y:190,s:.82,color:'#8a8d81',place:'on the windowsill'},
 {x:139,y:192,s:.66,color:'#c39065',place:'beside the clock'},
 {x:390,y:306,s:.91,color:'#c1ac90',place:'on the sofa'},
 {x:679,y:399,s:.82,color:'#997e67',place:'in the basket'},
 {x:197,y:444,s:.73,color:'#957c69',place:'under the armchair'},
 {x:112,y:481,s:1.02,color:'#ddba8c',place:'at the edge of the rug'},
 {x:487,y:479,s:.75,color:'#b38368',place:'under the coffee table'},
 {x:737,y:276,s:.78,color:'#8d9a81',place:'beside the tall plant'}
];
const decoyIDs=tricky?[0,3,7]:[], found=new Set(); let revealed=false;
const targets=positions.map((p,id)=>({...p,id,decoy:decoyIDs.includes(id),box:{X:p.x/850*100,Y:p.y/600*100,Width:62*p.s/850*100,Height:65*p.s/600*100}}));
function animal(p){const eyes=p.decoy?'<path d="m18 24 6 6m0-6-6 6m18-6 6 6m0-6-6 6" stroke="#5c5147" stroke-width="2"/>':'<path d="M17 28q4-6 8 0m10 0q4-6 8 0" stroke="#51473d" stroke-width="2" fill="none"/>';
return `<g data-target="${p.id}" role="button" tabindex="0" aria-label="Check hiding spot ${p.id+1}" transform="translate(${p.x} ${p.y}) scale(${p.s})" fill="${p.color}" stroke="#6f5e4e" stroke-width="1.5" stroke-linejoin="round"><path d="M45 52q21 4 12-17" fill="none" stroke="${p.color}" stroke-width="7" stroke-linecap="round"/><ellipse cx="29" cy="47" rx="22" ry="17"/><path d="m10 21 1-19 17 12q6-2 12 0L52 2l-1 23q3 20-21 20T10 21Z"/><path d="m15 18 1-9 9 8m16 0 7-9-1 11" fill="#d69e8b" stroke="none"/>${eyes}<path d="m28 32 3 3 3-3Z" fill="#9b6a61" stroke="none"/><path d="M31 35v4m-3-1 3 1 3-1m-20-5-10-2m10 6-10 1m42-5 12-2m-12 6 12 1" stroke="#6c594b" fill="none" stroke-width="1"/><ellipse cx="19" cy="59" rx="7" ry="4"/><ellipse cx="37" cy="59" rx="7" ry="4"/>${p.decoy?'<path d="M11 44q19 13 39 0M15 50l-3 4m11-1-1 5m11-4 1 5m9-7 3 4" stroke="#eee0ca" stroke-width="1.5" fill="none"/><rect x="46" y="46" width="10" height="7" fill="#f2dfb8" transform="rotate(18 46 46)"/>':'<path d="m25 15 2 6m8-6-2 6m-18 22 5 2m20-2-5 2" fill="none" stroke="#6f5e4e" stroke-width="2"/>'}</g>`}
document.getElementById('animals').innerHTML=targets.map(animal).join('');
function marks(){document.getElementById('marks').innerHTML=targets.filter(p=>!p.decoy&&(revealed||found.has(p.id))).map((p,i)=>`<rect class="found" x="${p.x-5}" y="${p.y-5}" width="${62*p.s+10}" height="${65*p.s+10}" rx="12"/><circle cx="${p.x+62*p.s}" cy="${p.y}" r="11" fill="#356b51"/><text class="number" x="${p.x+62*p.s}" y="${p.y+5}">${revealed?targets.filter(q=>!q.decoy).findIndex(q=>q.id===p.id)+1:'✓'}</text>`).join('')}
function tell(data){if(parent!==window)parent.postMessage({type:'cat-spot',scenario,...data},location.origin)}
function spot(p){if(revealed){tell({kind:'revealed'});return}if(!p){tell({kind:'miss'});return}if(p.decoy){tell({kind:'decoy'});return}const repeat=found.has(p.id);found.add(p.id);marks();tell({kind:repeat?'repeat':'cat',found:found.size,complete:found.size===targets.filter(p=>!p.decoy).length,place:p.place})}
document.getElementById('animals').addEventListener('keydown',event=>{if(!['Enter',' '].includes(event.key))return;const id=event.target.getAttribute('data-target');if(id===null)return;event.preventDefault();spot(targets.find(p=>p.id===Number(id)))})
document.getElementById('room').addEventListener('click',event=>{const bounds=event.currentTarget.getBoundingClientRect(),x=(event.clientX-bounds.left)*850/bounds.width,y=(event.clientY-bounds.top)*600/bounds.height;const p=targets.find(p=>x>=p.x-3&&x<=p.x+62*p.s+3&&y>=p.y-3&&y<=p.y+65*p.s+3);spot(p)});
// Synthetic answer map: used by the game and Playwright, never by the model.
window.catGame=Object.freeze({targets:()=>targets.map(p=>({id:p.id,decoy:p.decoy,box:{...p.box},place:p.place})),reveal:()=>{revealed=true;marks();return targets.filter(p=>!p.decoy).length}});
</script></body></html>
